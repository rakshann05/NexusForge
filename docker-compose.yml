version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexusforge
      POSTGRES_USER: nexusforge
      POSTGRES_PASSWORD: nexusforge
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:5432/nexusforge
      REDIS_URL: redis://redis:6379
      JWT_SECRET: changeme
      AI_PROVIDER: disabled
    depends_on:
      - postgres
      - redis
    ports:
      - '3001:3001'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:3001/api
    depends_on:
      - api
    ports:
      - '3000:3000'

volumes:
  postgres_data:
